---
layout: default
---

<section class="hero">
  <div class="wrap">
    <p class="kicker">{{ site.conference.dates }} &middot; {{ site.conference.location }}</p>
    <h1>{{ site.conference.title }}</h1>
    <p class="lede">{{ site.conference.blurb }}</p>
  </div>
</section>

{%- for s in site.sections %}
<section class="section" id="{{ s.id }}">
  <div class="wrap">
    <h2>{{ s.label }}</h2>
    {% include sections/{{ s.id }}.html %}
  </div>
</section>
{%- endfor %}
